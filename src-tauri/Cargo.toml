[package]
name = "speakex"
version = "0.1.0"
description = "Local-first desktop transcription app scaffold built with Tauri v2"
authors = ["rafaself"]
edition = "2021"

[lib]
name = "speakex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
cpal = "0.15"
keyring = "2.3.3"
